[build-system]
requires = ["scikit-build-core>=0.10", "setuptools_scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "ffs"
dynamic = ["version"]
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nicholas Devenish", email = "ndevenish@gmail.com" },
    { name = "Dimitri Vlachos", email = "dimitrios.vlachos@diamond.ac.uk" },
    { name = "James Beilsten-Edmands", email = "james.beilsten-edmands@diamond.ac.uk"},
]

requires-python = ">=3.12"
dependencies = [
    "pydantic>2",
    "pyepics>=3.5.7",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "rich>=13.9.4",
    "watchdir>=1.0.0",
    "zocalo>=1.2.0",
]

[project.scripts]
ssx_index = "ffs.ssx_index:run"
ffs_index_integrate = "ffs.index_integrate:run"
ffs_spotfind_index_integrate = "ffs.spotfind_index_integrate:run"

[dependency-groups]
dev = [
    "pytest",
]

# setuptools_scm still supplies the version, now as a metadata provider
[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]

# pytest.ini
[tool.pytest.ini_options]
testpaths = "tests"

[project.entry-points."workflows.services"]
"GPUPerImageAnalysis" = "ffs.service:GPUPerImageAnalysis"
"XRCResultCompare" = "compare_service:XRCResultCompare"

[tool.scikit-build]
# Keep this in step with build-system.requires above
minimum-version = "build-system.requires"
# A persistent build directory, so repeated installs are incremental and the
# compiled programs stay where the tests look for them, in build/bin
build-dir = "build"
wheel.packages = ["src/ffs"]
# The wheel carries exactly what is tagged, so a new install rule has to say
# COMPONENT ffs to be shipped. Everything else the dependencies install, their
# headers, static libraries, cmake packages and pkgconfig files, stays out.
# ffbidx's module carries a runtime path relative to its own library, so both
# of its components ship together
install.components = ["ffs", "ffbidx_python", "ffbidx_libraries"]
# Some C++ sources live under src/ffs and are compiled into ffs_common; they are
# not part of the python package
wheel.exclude = ["ffs/*.cc"]
# The build directory holds cmake's cache and dependency sources, and an sdist
# cannot carry the submodule or the fetched dependencies anyway
sdist.exclude = ["build*", "notes", "docs"]
messages.after-failure = "The C++ build failed. See the build notes in README.md; a CUDA configure failure usually means CUDA_ARCH needs setting for this card."

[tool.ruff]
lint.ignore = ["E501", "E741"]
lint.select = ["C9", "E", "F", "W", "I"]
lint.unfixable = ["F841"]
line-length = 88
