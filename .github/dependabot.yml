# The workflow actions are pinned to commit SHAs, which never move on
# their own; this keeps them current. Dependabot reads the version from
# the trailing comment on each pin and rewrites both together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # A compromised release is usually caught and pulled within days, so
    # hold off on proposing one until it has been out for a week.
    cooldown:
      default-days: 7
    # One pull request per month rather than one per action
    groups:
      actions:
        patterns: ["*"]
