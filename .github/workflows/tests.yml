name: CPU tests
on: [push, pull_request]
permissions:
  contents: read
# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: CPU baseline on ${{ matrix.name }}
    # The hosted runners have no GPU, so this builds without CUDA and runs
    # the tests of the baseline and the code it shares with the GPU programs.
    strategy:
      # Keep the other platforms running when one fails, to see all of them
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          # Apple silicon, with clang and libc++, where uint64_t and size_t
          # are distinct types
          - name: macOS arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    # A login shell, so each step runs inside the micromamba environment
    defaults:
      run:
        shell: bash -el {0}
    env:
      # Where dials.data downloads the test datasets, kept between runs
      DIALS_DATA: ${{ github.workspace }}/../dials_data
      ENVIRONMENT_FILE: environment.yml
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and tags, so setuptools_scm can resolve the version
          fetch-depth: 0
          submodules: recursive
      # environment.yml pins the Linux gcc, which conda-forge does not build
      # for macOS; the compilers metapackage supplies clang instead.
      - name: Derive the macOS environment
        if: runner.os == 'macOS'
        run: |
          grep -vE '^[[:space:]]*- (gcc|gxx)=' environment.yml > environment-macos.yml
          echo "ENVIRONMENT_FILE=environment-macos.yml" >> "$GITHUB_ENV"
      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ env.ENVIRONMENT_FILE }}
          environment-name: ffs
          cache-environment: true
      - name: Restore test datasets
        uses: actions/cache@v6
        with:
          path: ${{ env.DIALS_DATA }}
          key: dials-data-${{ runner.os }}-${{ hashFiles('h5read/tests/CMakeLists.txt') }}
      - name: Download test datasets
        run: dials.data get -q thaumatin_i03_rotation > /dev/null
      - name: Build
        run: ./build.sh --cpu
      - name: Test
        run: ctest --test-dir build --output-on-failure
