name: CPU tests
on:
  push:
    branches: ["main"]
  pull_request: null
  workflow_dispatch: null
permissions:
  contents: read
# Cancel superseded runs on the same ref.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: CPU baseline on ${{ matrix.name }}
    # The hosted runners have no GPU, so this builds without CUDA and runs
    # the tests of the baseline and the code it shares with the GPU programs.
    strategy:
      # Keep the other platforms running when one fails, to see all of them
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            runner: ubuntu-latest
          - name: Linux arm64
            runner: ubuntu-24.04-arm
          # Apple silicon, with clang and libc++, where uint64_t and size_t
          # are distinct types
          - name: macOS arm64
            runner: macos-26
    runs-on: ${{ matrix.runner }}
    # A login shell, so each step runs inside the micromamba environment
    defaults:
      run:
        shell: bash -el {0}
    env:
      # Where dials.data downloads the test datasets, kept between runs
      DIALS_DATA: ${{ github.workspace }}/../dials_data
      ENVIRONMENT_FILE: conda/development/environment.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, so setuptools_scm can resolve the version
          fetch-depth: 0
          submodules: recursive
      # Runs on the system python, as no conda environment exists yet
      - name: Derive the macOS environment
        if: runner.os == 'macOS'
        run: |
          python3 conda/derive.py --drop conda/macos/packages > environment-macos.yml
          echo "ENVIRONMENT_FILE=environment-macos.yml" >> "$GITHUB_ENV"
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1
        with:
          environment-file: ${{ env.ENVIRONMENT_FILE }}
          environment-name: ffs
          cache-environment: true
      - name: Restore test datasets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.DIALS_DATA }}
          key: dials-data-${{ runner.os }}-${{ hashFiles('h5read/tests/CMakeLists.txt') }}
      - name: Download test datasets
        run: dials.data get -q thaumatin_i03_rotation > /dev/null
      - name: Build
        run: ./build.sh --cpu
      - name: Test
        run: ctest --test-dir build --output-on-failure
