name: Conda update

# Moves the conda pins to the newest versions that solve together on every
# platform the environments install on, and opens one pull request with
# the result. conda/update.py does the solving.
on:
  schedule:
    # 06:36 UTC on the 4th of each month, away from the start of the hour
    # and the start of the month
    - cron: "36 6 4 * *"
  workflow_dispatch: null

permissions:
  contents: read

# A manual run alongside the scheduled one would race it to the branch
concurrency:
  group: conda-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the update branch
      pull-requests: write # open or edit the pull request
      actions: write # start CI on the branch
    env:
      BRANCH: conda-update
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # With no environment named, only the micromamba binary is installed;
      # the script runs its own dry-run solves
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3.2.1

      # Progress goes to the log and the list of changes to a file, for the
      # pull request body
      - name: Solve the pins
        run: python3 conda/update.py > "$RUNNER_TEMP/changes.txt"

      - name: Push the update branch
        id: push
        run: |
          if git diff --quiet; then
            echo "Every pin is already the newest that solves"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -qam "Update the conda pins"
          # The checkout keeps no credentials; gh lends the job token to git
          gh auth setup-git
          git push --force origin "$BRANCH"
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.push.outputs.pushed == 'true'
        run: |
          {
            echo "The newest versions that solve together on linux-64,"
            echo "linux-aarch64 and osx-arm64, from \`conda/update.py\`:"
            echo
            echo '```'
            cat "$RUNNER_TEMP/changes.txt"
            echo '```'
          } > "$RUNNER_TEMP/body.md"
          if [ "$(gh pr view "$BRANCH" --json state --jq .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --base main --head "$BRANCH" \
              --title "Update the conda pins" --body-file "$RUNNER_TEMP/body.md"
          fi

      # A push or pull request made with the job token starts no workflows,
      # but a dispatch does, and its checks attach to the branch's commit
      - name: Start CI on the branch
        if: steps.push.outputs.pushed == 'true'
        run: |
          gh workflow run tests.yml --ref "$BRANCH"
          gh workflow run docker-image.yml --ref "$BRANCH"
