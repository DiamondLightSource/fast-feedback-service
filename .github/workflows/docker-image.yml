name: Docker Image CI

on:
  push:
    branches: ["main"]
    # tags: ["v*"]  # Uncomment to trigger on version tags
  pull_request:
    branches: ["main"]

jobs:

  build:
    strategy:
      # Don't cancel the other arch build if one fails so we can see both.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # Full history and tags, so `git describe` below has something to describe
          fetch-depth: 0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare
        id: prep
        run: |
          # Registry image name.
          IMAGE_NAME="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          # linux/amd64 becomes linux-amd64, for a filesystem-safe artifact name.
          platform="${{ matrix.platform }}"
          echo "platform-pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          echo "version-describe=$(git describe --tags --long --first-parent)" >> "$GITHUB_OUTPUT"

      # Both images are built in this one job, rather than on a matrix
      # axis, so they can shared a compiled image
      - name: Build and push service image by digest
        id: build-service
        if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: service
          platforms: ${{ matrix.platform }}
          build-args: |
            FFS_VERSION_DESCRIBE=${{ steps.prep.outputs.version-describe }}
          # Push the per-arch image with no tag; it is addressable only by
          # its digest. This keeps intermediate arch builds out of the tag
          # list - the manifest job assembles the real tag from digests.
          outputs: type=image,name=${{ steps.prep.outputs.image-name }},push-by-digest=true,name-canonical=true,push=true

      - name: Build and push batch image by digest
        id: build-batch
        if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: batch
          platforms: ${{ matrix.platform }}
          build-args: |
            FFS_VERSION_DESCRIBE=${{ steps.prep.outputs.version-describe }}
          outputs: type=image,name=${{ steps.prep.outputs.image-name }}-batch,push-by-digest=true,name-canonical=true,push=true

      - name: Export digests
        if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
        run: |
          # Empty file whose name is the digest (minus the sha256: prefix);
          # the merge job only needs the names. Kept in a per-image
          # directory so that one image's digests can never be spliced
          # into the other's manifest.
          mkdir -p "${{ runner.temp }}/digests/service" "${{ runner.temp }}/digests/batch"
          service_digest="${{ steps.build-service.outputs.digest }}"
          batch_digest="${{ steps.build-batch.outputs.digest }}"
          touch "${{ runner.temp }}/digests/service/${service_digest#sha256:}"
          touch "${{ runner.temp }}/digests/batch/${batch_digest#sha256:}"

      - name: Upload service digest
        if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
        uses: actions/upload-artifact@v7
        with:
          name: digests-service-${{ steps.prep.outputs.platform-pair }}
          path: ${{ runner.temp }}/digests/service/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload batch digest
        if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
        uses: actions/upload-artifact@v7
        with:
          name: digests-batch-${{ steps.prep.outputs.platform-pair }}
          path: ${{ runner.temp }}/digests/batch/*
          if-no-files-found: error
          retention-days: 1

  create-manifest:
    if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
    needs: build
    runs-on: ubuntu-latest

    # Run the two images in parallel
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: service
            suffix: ""
          - image: batch
            suffix: "-batch"

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMAGE_NAME="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')${{ matrix.suffix }}"
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "manifest-tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "manifest-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Each downloaded file is named for one arch digest; reference
          # the images by digest so the manifest points straight at them.
          docker buildx imagetools create \
            -t ${{ steps.tags.outputs.image-name }}:${{ steps.tags.outputs.manifest-tag }} \
            $(printf '${{ steps.tags.outputs.image-name }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          image="${{ steps.tags.outputs.image-name }}:${{ steps.tags.outputs.manifest-tag }}"
          # GHCR takes a moment to make a freshly pushed tag readable, so
          # the create above can succeed while an immediate inspect still
          # 404s. Retry for a bit instead of failing the job over that gap.
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "$image"; then
              exit 0
            fi
            echo "Manifest not visible yet (attempt ${attempt}); retrying..."
            sleep 3
          done
          echo "Manifest still not visible after retries" >&2
          exit 1
