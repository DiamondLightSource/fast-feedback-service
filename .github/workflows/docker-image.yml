name: Docker Image CI

on:
  push:
    branches: ["main"]
    # A release tag publishes the image under its version. The .dev tags
    # only seed the version numbering, so they build nothing.
    tags: ["v*", "!v*.dev*"]
  pull_request:
    branches: ["main"]

# Read-only by default; the jobs that push to the registry widen it.
permissions:
  contents: read

jobs:

  build:
    strategy:
      # Don't cancel the other arch build if one fails so we can see both.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64

    runs-on: ${{ matrix.runner }}

    # A job-level block replaces the top-level one, so it restates the
    # checkout's read access alongside the registry push.
    permissions:
      contents: read
      packages: write

    # Both arches resolve the same version, so whichever sets it last is fine
    outputs:
      version: ${{ steps.prep.outputs.version }}

    # A pull request from a fork gets a read-only token and no access to
    # secrets, so it cannot push to the registry. It can still build.
    env:
      CAN_PUSH: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          # Full history and tags, so setuptools_scm below can resolve the version
          fetch-depth: 0

      - name: Prepare
        id: prep
        run: |
          # Registry image name.
          IMAGE_NAME="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')"
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          # linux/amd64 becomes linux-amd64, for a filesystem-safe artifact name.
          platform="${{ matrix.platform }}"
          echo "platform-pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
          # The image build has no git history, so resolve the version here and
          # pass it in. setuptools_scm is the same resolver the package uses, so
          # the image and a local install agree.
          python3 -m pip install --quiet --disable-pip-version-check setuptools-scm==10.3.4
          echo "version=$(python3 -m setuptools_scm)" >> "$GITHUB_OUTPUT"
          # Push the per-arch image with no tag; it is addressable only by
          # its digest. This keeps intermediate arch builds out of the tag
          # list - the manifest job assembles the real tag from digests.
          # Without push access the image is built and discarded, so the
          # compile and link are still checked.
          if [ "${CAN_PUSH}" = "true" ]; then
            echo "build-output-service=type=image,name=${IMAGE_NAME},push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
            echo "build-output-batch=type=image,name=${IMAGE_NAME}-batch,push-by-digest=true,name-canonical=true,push=true" >> "$GITHUB_OUTPUT"
          else
            echo "build-output-service=type=cacheonly" >> "$GITHUB_OUTPUT"
            echo "build-output-batch=type=cacheonly" >> "$GITHUB_OUTPUT"
          fi

      # Removing the builder deletes every layer it unpacked, which takes
      # around 40s. A hosted runner is discarded with the job, so only a
      # persistent runner needs it.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          cleanup: ${{ runner.environment != 'github-hosted' }}
      - name: Login to GitHub Container Registry
        if: env.CAN_PUSH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Persist the ccache dir across runs. actions/cache moves it in and out
      # of the GHA cache, and the dance copies it into the buildkit mount,
      # which is not otherwise exported. Only the compiler cache is carried:
      # caching the build-stage layers too was measured to cost more than it
      # saved, because exporting them every run outweighed the hits.
      - name: Restore ccache
        if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache-${{ steps.prep.outputs.platform-pair }}
          key: ccache-${{ steps.prep.outputs.platform-pair }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.prep.outputs.platform-pair }}-

      # Persist the fetched dependency sources the same way. The build uses
      # them as they are, so the key covers the file that pins them and the
      # one that chooses the toolchain.
      - name: Restore dependency sources
        if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/deps-${{ steps.prep.outputs.platform-pair }}
          key: deps-${{ steps.prep.outputs.platform-pair }}-${{ hashFiles('cmake/Modules/Dependencies.cmake', 'Dockerfile') }}

      # List each restored dependency with the commit it sits at. The
      # directory starts empty on every job, so anything in it came from the
      # cache.
      - name: Report restored dependency sources
        if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
        run: |
          deps="${{ runner.temp }}/deps-${{ steps.prep.outputs.platform-pair }}"
          if ! compgen -G "$deps/*-src" > /dev/null; then
            echo "No dependency sources restored, every dependency will be fetched"
            exit 0
          fi
          for src in "$deps"/*-src; do
            [ -d "$src" ] || continue
            rev=$(git -c safe.directory='*' -C "$src" rev-parse --short HEAD 2>/dev/null || echo "?")
            echo "$(basename "$src" -src) ${rev} $(du -sh "$src" | cut -f1)"
          done

      - name: Inject ccache and dependency sources into buildx
        if: ${{github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'}}
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "${{ runner.temp }}/ccache-${{ steps.prep.outputs.platform-pair }}": "/ccache",
              "${{ runner.temp }}/deps-${{ steps.prep.outputs.platform-pair }}": "/deps"
            }

      # Both images are built in this one job, rather than on a matrix
      # axis, so they can share a compiled image
      - name: Build service image
        id: build-service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: service
          platforms: ${{ matrix.platform }}
          build-args: |
            FFS_VERSION=${{ steps.prep.outputs.version }}
          outputs: ${{ steps.prep.outputs.build-output-service }}
          cache-from: type=gha,scope=layers-${{ steps.prep.outputs.platform-pair }}
          cache-to: type=gha,mode=max,scope=layers-${{ steps.prep.outputs.platform-pair }}

      - name: Build batch image
        id: build-batch
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: batch
          platforms: ${{ matrix.platform }}
          build-args: |
            FFS_VERSION=${{ steps.prep.outputs.version }}
          outputs: ${{ steps.prep.outputs.build-output-batch }}

      - name: Export digests
        if: env.CAN_PUSH == 'true'
        run: |
          # Empty file whose name is the digest (minus the sha256: prefix);
          # the merge job only needs the names. Kept in a per-image
          # directory so that one image's digests can never be spliced
          # into the other's manifest.
          mkdir -p "${{ runner.temp }}/digests/service" "${{ runner.temp }}/digests/batch"
          service_digest="${{ steps.build-service.outputs.digest }}"
          batch_digest="${{ steps.build-batch.outputs.digest }}"
          touch "${{ runner.temp }}/digests/service/${service_digest#sha256:}"
          touch "${{ runner.temp }}/digests/batch/${batch_digest#sha256:}"

      - name: Upload service digest
        if: env.CAN_PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-service-${{ steps.prep.outputs.platform-pair }}
          path: ${{ runner.temp }}/digests/service/*
          if-no-files-found: error
          retention-days: 1

      - name: Upload batch digest
        if: env.CAN_PUSH == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-batch-${{ steps.prep.outputs.platform-pair }}
          path: ${{ runner.temp }}/digests/batch/*
          if-no-files-found: error
          retention-days: 1

  create-manifest:
    # Nothing to assemble when the build could not push its per-arch digests.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push' }}
    needs: build
    runs-on: ubuntu-latest
    # No checkout here; it only pushes the manifest
    permissions:
      packages: write
    env:
      VERSION: ${{ needs.build.outputs.version }}

    # Run the two images in parallel
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: service
            suffix: ""
          - image: batch
            suffix: "-batch"

    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMAGE_NAME="ghcr.io/$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')${{ matrix.suffix }}"
          echo "image-name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "manifest-tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" == "tag" ]; then
            # A clean checkout of a release tag resolves to the bare version.
            # A local part (+g...) means it did not, and is not a valid image
            # tag either.
            if [[ -z "${VERSION}" || "${VERSION}" == *+* ]]; then
              echo "Tag ${{ github.ref_name }} resolved to '${VERSION}', not a release version" >&2
              exit 1
            fi
            echo "manifest-tag=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "manifest-tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          # Each downloaded file is named for one arch digest; reference
          # the images by digest so the manifest points straight at them.
          docker buildx imagetools create \
            -t ${{ steps.tags.outputs.image-name }}:${{ steps.tags.outputs.manifest-tag }} \
            $(printf '${{ steps.tags.outputs.image-name }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          image="${{ steps.tags.outputs.image-name }}:${{ steps.tags.outputs.manifest-tag }}"
          # GHCR takes a moment to make a freshly pushed tag readable, so
          # the create above can succeed while an immediate inspect still
          # 404s. Retry for a bit instead of failing the job over that gap.
          for attempt in 1 2 3 4 5; do
            if docker buildx imagetools inspect "$image"; then
              exit 0
            fi
            echo "Manifest not visible yet (attempt ${attempt}); retrying..."
            sleep 3
          done
          echo "Manifest still not visible after retries" >&2
          exit 1
