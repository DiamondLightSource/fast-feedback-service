image:
  repository: ghcr.io/diamondlightsource/fast-feedback-service
  tag: latest

# Beamline configuration
beamline: "i24"

zocalo:
  config: "/dls_sw/apps/zocalo/live/configuration.yaml"
  queue: "per_image_analysis.i24"
  # Which service in the image this release runs
  service: "GPUPerImageAnalysis"

resources:
  cpu: 40
  memory: 100Gi
  gpu: 1

# Set enabled to run a batch indexing and integration Job instead
# of the long-running service Deployment. See values.index-integrate.yaml.
job:
  enabled: false
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  reflection: ""
  experiment: ""
  workingDirectory: ""
  maxCell: ""
  dmin: ""
  extraArgs: []

# Additional environment variables
extraEnv:
  # SPOTFINDER: "/opt/ffs/bin/spotfinder"
    SPOTFINDER_TIMEOUT: 60

# Additional node selector labels
nodeSelector:
  kubernetes.io/hostname: "cs05r-i24-k8s-serv-02.diamond.ac.uk"

# Pod-level security context
podSecurityContext:
  # dls_softinst group
  supplementalGroups:
    - 37910
    - 37948

# Container-level security context
containerSecurityContext:
  # k8s-i24-beamline user
  runAsUser: 36145
