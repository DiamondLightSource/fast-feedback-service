image:
  repository: ghcr.io/diamondlightsource/fast-feedback-service
  tag: latest

# Beamline configuration
beamline: "i24"

zocalo:
  config: "/dls_sw/apps/zocalo/live/configuration.yaml"
  queue: "per_image_analysis.i24"
  # Which service in the image this release runs
  service: "GPUPerImageAnalysis"

resources:
  cpu: 40
  memory: 100Gi
  gpu: 1

# Which workload this release runs. "service" is the long-running
# Deployment, every other mode is a batch Job. Each has a values
# file alongside this one.
mode: service

# Settings common to the batch Jobs, whichever mode is selected
batch:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600

# Inputs for mode: index-integrate
indexIntegrate:
  reflection: ""
  experiment: ""
  workingDirectory: ""
  maxCell: ""
  dmin: ""
  extraArgs: []

# Inputs for mode: process. Anything beyond these, such as the
# spotfinder tuning, goes through extraArgs.
process:
  data: ""
  experiment: ""
  workingDirectory: ""
  maxCell: ""
  dmin: ""
  extraArgs: []

# Additional environment variables
extraEnv:
  # SPOTFINDER: "/opt/ffs/bin/spotfinder"
    SPOTFINDER_TIMEOUT: 60

# Additional node selector labels
nodeSelector:
  kubernetes.io/hostname: "cs05r-i24-k8s-serv-02.diamond.ac.uk"

# Pod-level security context
podSecurityContext:
  # dls_softinst group
  supplementalGroups:
    - 37910
    - 37948

# Container-level security context
containerSecurityContext:
  # k8s-i24-beamline user
  runAsUser: 36145
