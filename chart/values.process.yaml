# Batch spotfinding, indexing and integration of a single dataset.
# Renders a Job instead of the service Deployment, using the batch
# image, with the beamline filesystem mounted read-write for the
# working directory.
image:
  repository: ghcr.io/diamondlightsource/fast-feedback-service-batch
  tag: latest

# The beamline whose filesystem this release mounts. The paths below
# name it again, carrying a visit directory that changes every run.
beamline: "i24"

# Explicitly null, not {}: helm coalesces maps, so an empty map would
# leave the service defaults in place rather than clearing them
extraEnv: null

mode: process

# Inputs and output location for one run, passed to the container as
# command line arguments. The experiment list is required: the image
# carries no DIALS, so it cannot produce one from the data.
process:
  data: "/dls/i24/data/2026/cm12345-1/i24_1.nxs"
  experiment: "/dls/i24/data/2026/cm12345-1/processed/imported.expt"
  workingDirectory: "/dls/i24/data/2026/cm12345-1/processed/gpu-processing"
  maxCell: "100"
  dmin: ""
  extraArgs: []

nodeSelector:
  kubernetes.io/hostname: "cs05r-i24-k8s-serv-02.diamond.ac.uk"

podSecurityContext:
  # dls_softinst group
  supplementalGroups:
    - 37910
    - 37948

containerSecurityContext:
  # k8s-i24-beamline user
  runAsUser: 36145
